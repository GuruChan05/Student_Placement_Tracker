<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Placement Tracker</h1>
        <p>Manage student placement records</p>
    </header>

    <main>

        <!-- ========================= -->
        <!-- ADD / EDIT STUDENT -->
        <!-- ========================= -->

        <section>

            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                >

                <input
                    type="text"
                    id="company"
                    placeholder="Company"
                >

                <input
                    type="text"
                    id="role"
                    placeholder="Job Role"
                >

                <input
                    type="number"
                    id="package"
                    placeholder="Package (LPA)"
                    min="0"
                    step="0.1"
                >

                <select id="status">

                    <option value="Placed">
                        Placed
                    </option>

                    <option value="Not Placed">
                        Not Placed
                    </option>

                </select>

                <button type="submit">
                    Save Student
                </button>

                <button
                    type="button"
                    id="cancelEditButton"
                    style="display: none;"
                >
                    Cancel Edit
                </button>

            </form>

        </section>


        <!-- ========================= -->
        <!-- STATISTICS -->
        <!-- ========================= -->

        <section>

            <h2>Placement Statistics</h2>

            <div class="stats">

                <div>
                    <h3>Total Students</h3>
                    <p id="totalStudents">0</p>
                </div>

                <div>
                    <h3>Placed</h3>
                    <p id="placedStudents">0</p>
                </div>

                <div>
                    <h3>Not Placed</h3>
                    <p id="notPlacedStudents">0</p>
                </div>

                <div>
                    <h3>Average Package</h3>
                    <p id="averagePackage">0 LPA</p>
                </div>

                <div>
                    <h3>Highest Package</h3>
                    <p id="highestPackage">0 LPA</p>
                </div>

                <div>
                    <h3>Placement Percentage</h3>
                    <p id="placementPercentage">0%</p>
                </div>

            </div>

        </section>


        <!-- ========================= -->
        <!-- SEARCH / FILTER / SORT -->
        <!-- ========================= -->

        <section>

            <h2>Student Records</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, company or role"
            >

            <select id="filterStatus">

                <option value="All">
                    All Students
                </option>

                <option value="Placed">
                    Placed
                </option>

                <option value="Not Placed">
                    Not Placed
                </option>

            </select>


            <select id="sortOption">

                <option value="none">
                    No Sorting
                </option>

                <option value="name">
                    Name A-Z
                </option>

                <option value="packageHigh">
                    Package High-Low
                </option>

                <option value="packageLow">
                    Package Low-High
                </option>

            </select>

            <div id="studentList"></div>

        </section>


        <!-- ========================= -->
        <!-- CLEAR ALL -->
        <!-- ========================= -->

        <button
            id="clearButton"
            class="clear-button"
        >
            Clear All Records
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>
